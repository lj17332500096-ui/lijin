# 一致性护栏：秒级反馈，挡住"名册漂移"这类静态可检的问题。
#
# 为什么要单独一份：簇 2（名册与能力自省不一致）是**纯静态**可检的 ——
# 不需要 DB、不需要模型、不需要并发。等 11 分钟的全量才报出来，代价比
# 一次 PR 往返高得多。这份是 ci.yml 的止血位，不是它的替代。
name: guard-consistency

on:
  pull_request:
    paths:
      - "runtime/**"
      - "benchmark/**"
      - "integrations/**"
      - "skills/**"
      - "scripts/**"
      - ".github/workflows/guard-consistency.yml"
      - ".ci/**"
      - "tests/test_tool_roster_consistency.py"
      - "tests/test_capability_introspection.py"
      - "tests/test_capability_gate_no_false_strip.py"
      - "tests/test_mcp_bridge_policy.py"
      - "tests/test_conversation_workflow.py"
      - "tests/test_ci_workflow_shell_syntax.py"
  workflow_dispatch:

concurrency:
  group: guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consistency:
    runs-on: windows-latest
    # job 级 env:，不是独立的 "Inject explicit env" 步骤。
    # 每个 `run:` 都是独立进程，步骤内 `$env:X = ...` 不会传给后续步骤
    # （已实测：第二个 pwsh 进程读到空值）。独立步骤会制造"注入了"的假象。
    env:
      APPROVAL: "on"
      FORGE_TRUSTED_CODE_ROOTS: ""
      FORGE_OBLIGATION_GATE: "off"
      FORGE_TEST_MODE: "1"
      # .env 不入库 ⇒ runner 上缺失的键在此显式补齐（理由见 ci.yml 的同名注释）。
      ALLOW_CODE_EXEC: "true"
      ALLOW_PROJECT_EDIT: "true"
      AGENT_MODEL: "ci-placeholder-model"
      FORGE_MODEL_PREF: "gateway"
      OPENAI_BASE_URL: "https://ci.invalid/v1"
      OPENAI_API_KEY: "ci-placeholder-key"
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要 base ref 才能算改动文件；浅克隆会导致 diff 不可用。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pypdf

      - name: Prepare runner-absent directories
        shell: pwsh
        # web/llama-ui 被 .gitignore 排除，runner 上不存在；
        # StaticFiles(directory=...) 会在目录缺失时抛 RuntimeError。
        run: New-Item -ItemType Directory -Force -Path web/llama-ui | Out-Null

      - name: Static consistency tests
        run: >
          python -m pytest -q -p no:cacheprovider
          tests/test_tool_roster_consistency.py
          tests/test_capability_introspection.py
          tests/test_capability_gate_no_false_strip.py
          tests/test_mcp_bridge_policy.py
          tests/test_conversation_workflow.py
          tests/test_ci_workflow_shell_syntax.py

      # 自检：本 workflow 自身的 run 步骤能否被声明的 shell 解析。
      # 这条看似自指，但正是它能在 push 之前挡住"改了 workflow 忘了换 shell
      # 语法"——上一版就是在这里用 bash 的 `<` 重定向，YAML 合法但 runner
      # 解析期就失败，PR 上第一个 commit 必红。
      - name: Workflow shell syntax self-check
        run: python scripts/check_workflow_shells.py

      # 门禁一致性：改动文件 → 选测子集 + 已知失败基线比对。
      # 这条与本地 pre-commit 钩子跑的是同一个脚本/同一份基线，
      # 避免"本地过、CI 红"或反之。
      #
      # 两个 shell 层面的坑，都必须记住：
      #
      # 1. 输入重定向：`<` 在 PowerShell 里是**保留运算符**（"为将来使用而保留"），
      #    写成 `python scripts/ci_gate.py --stdin < changed.txt` 会让步骤在
      #    **解析期**就失败 —— YAML 合法但 runner 起不来。
      #    PowerShell 的输入重定向是管道：`Get-Content x | cmd`。
      #
      # 2. `github.base_ref` 只在 pull_request 事件下有值。
      #    workflow_dispatch（以及任何非 PR 触发）下它是空串，
      #    于是 `origin/${{ github.base_ref }}` 变成 `origin/`，
      #    `git diff --name-only origin/` 实测 exit 128（fatal: ambiguous argument）。
      #    上一版没有任何防护 —— 这条只对 PR 有效，一手动触发就红。
      - name: Verify local gate mapping covers changed files
        shell: pwsh
        run: |
          $baseRef = "${{ github.base_ref }}"
          if ([string]::IsNullOrWhiteSpace($baseRef)) {
            # 非 PR 触发：没有可比对的 base，退回与 HEAD~1 比。
            # 直接跑 `origin/` 会 fatal，故必须显式选一个存在的 ref。
            Write-Host "no base_ref (event=${{ github.event_name }}); diffing against HEAD~1"
            $base = "HEAD~1"
          }
          else {
            git fetch origin $baseRef --depth=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $base = "origin/$baseRef"
          }
          git diff --name-only $base > changed.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "--- changed files (base=$base) ---"
          Get-Content changed.txt
          # 空 changed.txt（首次 push / 无改动）时管道传空 stdin，
          # ci_gate 走 `if not tests: return 0` 分支，正常放行。
          Get-Content changed.txt | python scripts/ci_gate.py --stdin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Baseline is well-formed
        # load_baseline() 会在缺 `# 原因` 时 SystemExit；这里提前失败并给出可读信息。
        run: python -c "import sys; sys.path.insert(0,'scripts'); import ci_gate; print('baseline entries:', len(ci_gate.load_baseline()))"
