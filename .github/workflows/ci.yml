name: ci

# PR 门禁主测试。设计依据：docs/audits/MIGRATION_POST_REVIEW_2026-10-04.md §5.2。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 只给 `contents: write` —— 失败时要把诊断摘要推到 `ci-diagnostics` 分支，
# 否则匿名读不到失败原因（logs/artifact/summary 全部要登录，见该步骤注释）。
# 其余权限一律不给（不读 secrets、不写 PR、不写 issues）。
permissions:
  contents: write

jobs:
  pytest:
    # windows-latest 是**刻意**选择，不是省事：
    # 簇 3（SQLITE_READONLY / WAL -shm 退化）只在 Windows 上复现。
    # 换 ubuntu 等于把这条红灯永久藏起来 —— 那比 CI 慢更糟。
    runs-on: windows-latest
    strategy:
      # 必须 false：否则一片红会 cancel 掉其余三片，掩盖多个独立问题。
      fail-fast: false
      matrix:
        # 刻意用 **0-based** 片号，与 scripts/ci_shard.py 的 --shard-id 语义一致。
        # 上一版写 matrix.shard: [1,2,3,4] 再在表达式里做减一（把片号减 1），
        # 但 GitHub 表达式**没有减法运算符**（官方 operator 表只有
        # ( ) [ ] . ! < <= > >= == != && ||），那行会在求值期直接失败。
        # 与其依赖一个不存在的能力，不如让矩阵本身就等于 --shard-id。
        # 代价：artifact 名为 report-0..report-3（0-based）。这是刻意接受的 ——
        # 换来的是"矩阵值 == --shard-id"这条一眼可验的不变式。
        # ⚠️ 注释里**不能写双花括号表达式**（GitHub 连注释一起求值，10-05 实测
        # 踩过：注释里的示例表达式同样被解析，整个 workflow 0 job 秒失败）。
        # 所以上面只说「做减一」而不写符号。需要举例时写到本文件外的文档里。
        shard: [0, 1, 2, 3]
    # P0-1 的前提：CI 上**没有** .env（它未被 git 跟踪）。
    #
    # 这里用 **job 级 env:** 而不是单独一个 "Inject explicit env" 步骤 ——
    # 每个 `run:` 步骤都是**独立进程**，步骤内 `$env:FOO = "x"` 不会传给后续步骤
    # （已在本地用两个 pwsh 进程实测：STEP2 读到的是空值）。
    # 写成独立步骤的后果是"看起来注入了、实际全丢"，比不写更危险：
    # 读者会以为护栏已开，实际靠默认值蒙对。job 级 env: 由 runner 在每个步骤
    # 启动前注入，是唯一能真正跨步骤生效的写法。
    env:
      # 护栏默认开，且由 runtime/startup_guard.py 在启动时强制断言。
      APPROVAL: "on"
      # 测试不需要可信代码根（会因机器相关路径拒绝大量用例）
      FORGE_TRUSTED_CODE_ROOTS: ""
      FORGE_OBLIGATION_GATE: "off"
      FORGE_TEST_MODE: "1"
      # ---- 以下是本机 .env 提供、但 .env 不入库 ⇒ runner 上必须显式补齐 ----
      # 缺 ALLOW_CODE_EXEC 时 tests/test_codex_loop.py 会因"代码执行未开启"而红。
      ALLOW_CODE_EXEC: "true"
      ALLOW_PROJECT_EDIT: "true"
      # 缺模型名时 tests/test_multimodal.py 报".env 里没有配置模型"。
      # 用占位值即可：这些用例断言的是**分支逻辑**，不真调模型。
      AGENT_MODEL: "ci-placeholder-model"
      # 显式钉住"走网关"。不设时 test_model_select 的默认路径会因缺后端配置而变 None。
      FORGE_MODEL_PREF: "gateway"
      # 指向不可路由的假端点：既满足"有 base_url"的接线断言，
      # 又保证任何真实出网尝试必然失败而不是打到真服务。
      OPENAI_BASE_URL: "https://ci.invalid/v1"
      OPENAI_API_KEY: "ci-placeholder-key"
      # 本机存在 Python shim 劫持 shutil.rmtree 的现象（会产生一批
      # SystemExit:1 假失败）。CI 上显式清空以保证结果可复现。
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # requirements.txt 里没有 pytest（它是开发依赖，不是运行时依赖），
        # 故这里显式补 pytest。不引 pytest-shard：分片由 scripts/ci_shard.py 做，
        # 少一个装不上的外部插件就少一处 CI 失败源。
        #
        # pypdf 必须显式装：requirements.txt 里那行是**注释掉的**可选依赖，
        # 但 tests/test_sources_rag.py::test_docx_pdf_sources 无条件 `from pypdf import
        # PdfWriter`（没有 try/except 也没有 skip）。本地绿是因为 .venv 里恰好装了。
        # 已在本地用 import 拦截器模拟"未安装 pypdf"实测：该用例确实 ImportError 变红。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pypdf

      - name: Prepare runner-absent directories
        shell: pwsh
        # web/llama-ui 被 .gitignore 排除（.gitignore:83，9.3M 前端构建产物），
        # runner 上 clone 之后**不存在**。但 llama_bridge.py:214 用
        # StaticFiles(directory=.../web/llama-ui)，Starlette 在目录不存在时
        # 直接抛 RuntimeError —— 12 条用例（test_api_layer_phase_c / test_ui_isolation）
        # 因此变红。只需建空目录即可，不必（也不该）把 9.3M 产物入库。
        run: New-Item -ItemType Directory -Force -Path web/llama-ui | Out-Null

      - name: Resolve shard
        id: shard
        shell: pwsh
        run: |
          $files = python scripts/ci_shard.py --num-shards 4 --shard-id ${{ matrix.shard }}
          Write-Host "shard ${{ matrix.shard }}: $files"
          "files=$files" >> $env:GITHUB_OUTPUT

      - name: Run tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path var/test-reports | Out-Null
          # runner 会把双花括号表达式求值后**文本替换**进脚本，展开出来是一串
          # 字面量 token，PowerShell 按空白拆成独立参数（已实测 4 路径 + -q → 5 argv）。
          # 不要"顺手改成变量"：PowerShell 不对变量做词分割，整个空格串会作为
          # 单个参数传给 pytest，报 "file or directory not found: a.py b.py" (exit 4)。
          #
          # ⚠️ 两条硬约束（10-05 首跑两次踩坑，改之前先读这段）：
          #① 命令必须**单行**，不用 PowerShell 续行反引号。
          # ② **注释里禁止出现双花括号**：GitHub 对 run: 块求值时**注释也不例外**，
          #    注释里的字面量示例同样被求值 ⇒ 解析失败 ⇒ **整个文件被拒绝执行**
          #    ⇒ 表现为 completed/failure 但 **jobs=0**（不是某步失败）。
          #    要举例必须写到文件外的文档里。
          #
          # 失败诊断（10-05 第二次首跑：4 片全红但本地全绿，junit 需登录才能下载，
          # 故把摘要直接写进 job summary —— 打开 run 页面即可看到，不必下载 artifact）：
          python -m pytest ${{ steps.shard.outputs.files }} -q --junitxml=var/test-reports/ci-${{ matrix.shard }}.xml -p no:cacheprovider --tb=short 2>&1 | Tee-Object -FilePath var/test-reports/pytest-out.txt
          if ($LASTEXITCODE -ne 0) {
            # 用 [char]96 构造代码围栏，**不要在脚本里写反引号** ——
            # PowerShell 会把成对的反引号当转义符，parser 直接报
            # 「表达式或语句中包含意外的标记」（已被 check_workflow_shells 抓到）。
            $fence = [string][char]96 * 3
            $lines = @("## 分片 ${{ matrix.shard }} 失败（exit $LASTEXITCODE）", "", "$fence" + "text")
            $lines += Get-Content var/test-reports/pytest-out.txt -Tail 120
            $lines += $fence
            $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      # 上面的 if 块内**刻意不写** `exit $LASTEXITCODE`：
      # 已实测（Tee-Object 管道 + if 块无 exit）pwsh 的最终退出码仍等于
      # `$LASTEXITCODE`=pytest 的退出码 ⇒ Run tests 照样红 ⇒ 本步骤的
      # `if: failure()` 照样触发。写了 exit 反而会让 job 在上一步终止、
      # 本步骤永远不执行，诊断分支就永远推不上去。
      - name: Publish failure diagnostics to ci-diagnostics branch
        if: ${{ failure() && steps.shard.outputs.files != '' }}
        shell: pwsh
        # 为什么需要这一步（10-05 CI 定位困难实据）：
        #   job summary / artifact / logs **都需要登录**才能看，匿名 API 读
        #   `/logs` 是 403、`artifacts` 下载是 401、step summary 只在网页渲染。
        #   结果是「本地复现不出来」时**拿不到失败原因**，只能等人贴日志。
        #   把摘要推到专用分支后，`raw.githubusercontent.com` **匿名可读**
        #   （已实测 200）⇒ 排查闭环，不必依赖人工转述。
        #
        # 只在失败时推；分支是纯诊断产物，不影响 main，也不参与任何 workflow。
        run: |
          New-Item -ItemType Directory -Force -Path ci-diag | Out-Null
          $shard = "${{ matrix.shard }}"
          $body = @("# shard $shard", "", "run: $env:GITHUB_RUN_ID", "", "pytest -q --tb=short", "")
          $body += (Get-Content var/test-reports/pytest-out.txt -Tail 200)
          # ⚠️ 文件名**必须带 run id**：`fail-fast: false` 下 4 个 shard 并发，
          # 都往同名文件推会互相覆盖（force push 后只剩最后一个 shard 的）。
          # 带 run id ⇒ 每次运行一组新文件，历史也留着可回查。
          $file = "ci-diag/run-$env:GITHUB_RUN_ID-shard-$shard.md"
          $body | Out-File -FilePath $file -Encoding utf8
          git config user.name  "ci-diagnostics"
          git config user.email "ci-diagnostics@users.noreply.github.com"
          # 从远端已有分支增量构建（保留历史诊断文件），推不上去就新建。
          git fetch origin ci-diagnostics --depth=1 2>$null
          if ($LASTEXITCODE -eq 0) {
            git checkout -B ci-diagnostics FETCH_HEAD
          } else {
            git checkout --orphan ci-diagnostics
            git rm -rf . --quiet 2>$null
          }
          git add $file
          git commit -m "diag: shard $shard failure (run $env:GITHUB_RUN_ID)"
          # 并发下 force push 后到先到：每个 shard 带不同文件名，
          # 丢掉的那次 push 只影响本次运行的某个文件，重新 push 即可补回。
          git push origin ci-diagnostics --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.shard }}
          path: var/test-reports/
          if-no-files-found: warn
