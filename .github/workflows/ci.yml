name: ci

# PR 门禁主测试。设计依据：docs/audits/MIGRATION_POST_REVIEW_2026-10-04.md §5.2。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # windows-latest 是**刻意**选择，不是省事：
    # 簇 3（SQLITE_READONLY / WAL -shm 退化）只在 Windows 上复现。
    # 换 ubuntu 等于把这条红灯永久藏起来 —— 那比 CI 慢更糟。
    runs-on: windows-latest
    strategy:
      # 必须 false：否则一片红会 cancel 掉其余三片，掩盖多个独立问题。
      fail-fast: false
      matrix:
        # 刻意用 **0-based** 片号，与 scripts/ci_shard.py 的 --shard-id 语义一致。
        # 上一版写 matrix.shard: [1,2,3,4] 再在表达式里做减一（把片号减 1），
        # 但 GitHub 表达式**没有减法运算符**（官方 operator 表只有
        # ( ) [ ] . ! < <= > >= == != && ||），那行会在求值期直接失败。
        # 与其依赖一个不存在的能力，不如让矩阵本身就等于 --shard-id。
        # 代价：artifact 名为 report-0..report-3（0-based）。这是刻意接受的 ——
        # 换来的是"矩阵值 == --shard-id"这条一眼可验的不变式。
        # ⚠️ 注释里**不能写双花括号表达式**（GitHub 连注释一起求值，10-05 实测
        # 踩过：注释里的示例表达式同样被解析，整个 workflow 0 job 秒失败）。
        # 所以上面只说「做减一」而不写符号。需要举例时写到本文件外的文档里。
        shard: [0, 1, 2, 3]
    # P0-1 的前提：CI 上**没有** .env（它未被 git 跟踪）。
    #
    # 这里用 **job 级 env:** 而不是单独一个 "Inject explicit env" 步骤 ——
    # 每个 `run:` 步骤都是**独立进程**，步骤内 `$env:FOO = "x"` 不会传给后续步骤
    # （已在本地用两个 pwsh 进程实测：STEP2 读到的是空值）。
    # 写成独立步骤的后果是"看起来注入了、实际全丢"，比不写更危险：
    # 读者会以为护栏已开，实际靠默认值蒙对。job 级 env: 由 runner 在每个步骤
    # 启动前注入，是唯一能真正跨步骤生效的写法。
    env:
      # 护栏默认开，且由 runtime/startup_guard.py 在启动时强制断言。
      APPROVAL: "on"
      # 测试不需要可信代码根（会因机器相关路径拒绝大量用例）
      FORGE_TRUSTED_CODE_ROOTS: ""
      FORGE_OBLIGATION_GATE: "off"
      FORGE_TEST_MODE: "1"
      # ---- 以下是本机 .env 提供、但 .env 不入库 ⇒ runner 上必须显式补齐 ----
      # 缺 ALLOW_CODE_EXEC 时 tests/test_codex_loop.py 会因"代码执行未开启"而红。
      ALLOW_CODE_EXEC: "true"
      ALLOW_PROJECT_EDIT: "true"
      # 缺模型名时 tests/test_multimodal.py 报".env 里没有配置模型"。
      # 用占位值即可：这些用例断言的是**分支逻辑**，不真调模型。
      AGENT_MODEL: "ci-placeholder-model"
      # 显式钉住"走网关"。不设时 test_model_select 的默认路径会因缺后端配置而变 None。
      FORGE_MODEL_PREF: "gateway"
      # 指向不可路由的假端点：既满足"有 base_url"的接线断言，
      # 又保证任何真实出网尝试必然失败而不是打到真服务。
      OPENAI_BASE_URL: "https://ci.invalid/v1"
      OPENAI_API_KEY: "ci-placeholder-key"
      # 本机存在 Python shim 劫持 shutil.rmtree 的现象（会产生一批
      # SystemExit:1 假失败）。CI 上显式清空以保证结果可复现。
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # requirements.txt 里没有 pytest（它是开发依赖，不是运行时依赖），
        # 故这里显式补 pytest。不引 pytest-shard：分片由 scripts/ci_shard.py 做，
        # 少一个装不上的外部插件就少一处 CI 失败源。
        #
        # pypdf 必须显式装：requirements.txt 里那行是**注释掉的**可选依赖，
        # 但 tests/test_sources_rag.py::test_docx_pdf_sources 无条件 `from pypdf import
        # PdfWriter`（没有 try/except 也没有 skip）。本地绿是因为 .venv 里恰好装了。
        # 已在本地用 import 拦截器模拟"未安装 pypdf"实测：该用例确实 ImportError 变红。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pypdf

      - name: Prepare runner-absent directories
        shell: pwsh
        # web/llama-ui 被 .gitignore 排除（.gitignore:83，9.3M 前端构建产物），
        # runner 上 clone 之后**不存在**。但 llama_bridge.py:214 用
        # StaticFiles(directory=.../web/llama-ui)，Starlette 在目录不存在时
        # 直接抛 RuntimeError —— 12 条用例（test_api_layer_phase_c / test_ui_isolation）
        # 因此变红。只需建空目录即可，不必（也不该）把 9.3M 产物入库。
        run: New-Item -ItemType Directory -Force -Path web/llama-ui | Out-Null

      - name: Resolve shard
        id: shard
        shell: pwsh
        run: |
          $files = python scripts/ci_shard.py --num-shards 4 --shard-id ${{ matrix.shard }}
          Write-Host "shard ${{ matrix.shard }}: $files"
          "files=$files" >> $env:GITHUB_OUTPUT

      - name: Run tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path var/test-reports | Out-Null
          # runner 会把双花括号表达式求值后**文本替换**进脚本，所以展开出来的是
          # 一串字面量 token（不是某个变量），PowerShell 按空白拆成独立参数。
          # 已实测：4 个路径 + -q 正确分成 5 个 argv。
          # 反面提醒：若改成先存进变量再展开（`$files = ...; pytest $files`），
          # PowerShell **不会**对变量做词分割 —— 整个空格串会作为单个参数传给
          # pytest，报 "file or directory not found: a.py b.py c.py"（exit 4）。
          # 本地实测过这个失败，故保持字面量展开，不要"顺手改成变量"。
          #
          # ⚠️ **本块必须单行，且注释里禁止出现双花括号**（10-05 首跑实测踩坑）：
          # GitHub 会对 `run:` 块做表达式求值，**注释也不例外**。块内任何
          # 形如「双花括号 + 内容」的写法都会被解析成真表达式；注释里写一个
          # **字面量示例**（比如「双花括号里留空」）时，它同样被求值，解析器遇到
          # 不完整的表达式就报 (Line:103, Col:14): An expression was expected，
          # **后果是整个 workflow 拒绝执行、0 个 job 被创建**（run 秒失败）——
          # 不是某一步失败，是全文件不可用。
          # 所以：① 命令写成一行，不用 PowerShell 续行反引号；
          #      ② 注释里要提表达式时，只写「双花括号」这四个字，别写符号本身。
          # 校验：actionlint 1.7.12 能查出这类错误（本仓库
          # scripts/check_workflow_shells.py 只查 shell 声明，两者互补）。
          python -m pytest ${{ steps.shard.outputs.files }} -q --junitxml=var/test-reports/ci-${{ matrix.shard }}.xml -p no:cacheprovider

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.shard }}
          path: var/test-reports/
          if-no-files-found: warn
